db:
  - path: ${SQLITE_PATH:-${DATA_DIR:-/app/data}/omniroute.db}
    replicas:
      - url: s3://${SUPABASE_S3_BUCKET}/${SUPABASE_S3_PREFIX:-omniroute}/omniroute.db
        endpoint: ${SUPABASE_S3_ENDPOINT}
        region: ${SUPABASE_S3_REGION:-us-east-1}
        force-path-style: true
        access-key-id: ${SUPABASE_S3_ACCESS_KEY_ID}
        secret-access-key: ${SUPABASE_S3_SECRET_ACCESS_KEY}
